<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>J.A.R.V.I.S</title>
<meta name="theme-color" content="#04101a">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.svg">
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#04101a;--panel:#07202f;--line:#1b4a5e;--cy:#5ee7ff;--ice:#d6f6ff;--am:#ffb347;--dim:#6fa3b5;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ice);font-family:"Rajdhani","Segoe UI",system-ui,sans-serif;font-size:17px}
body{background:radial-gradient(ellipse at 50% 30%,#0a2c3f 0%,var(--bg) 65%) fixed}
main{max-width:760px;margin:0 auto;padding:14px 16px 24px;display:grid;gap:14px}
header{display:flex;justify-content:space-between;align-items:baseline}
h1{margin:0;font-size:1.5rem;font-weight:700;letter-spacing:.32em;color:var(--cy)}
#clock{font-size:1.3rem;font-weight:500;font-variant-numeric:tabular-nums}
#core{position:relative;width:min(70vw,300px);aspect-ratio:1;margin:6px auto}
#core svg{width:100%;height:100%;overflow:visible}
.r1{animation:spin 40s linear infinite;transform-origin:150px 150px}
.r2{animation:spin 24s linear infinite reverse;transform-origin:150px 150px}
.r3{animation:spin 12s linear infinite;transform-origin:150px 150px}
@keyframes spin{to{transform:rotate(360deg)}}
#glow{transform-origin:150px 150px;animation:idle 4s ease-in-out infinite}
@keyframes idle{50%{transform:scale(1.08);opacity:.75}}
body.talk #glow{animation:talk .35s ease-in-out infinite}
@keyframes talk{50%{transform:scale(1.35)}}
body.listen #glow{fill:var(--am)}
#state{text-align:center;margin-top:-6px;color:var(--dim);letter-spacing:.2em;font-size:.95rem}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:10px 12px}
.card b{display:block;font-size:.9rem;color:var(--dim);font-weight:500}
.card span{font-size:1.4rem;font-weight:700;color:var(--cy);font-variant-numeric:tabular-nums}
.bar{height:4px;background:var(--line);margin-top:6px}
.bar i{display:block;height:100%;width:50%;background:var(--cy);transition:width .8s}
#log{height:190px;overflow-y:auto;border:1px solid var(--line);border-radius:6px;background:rgba(7,32,47,.7);padding:10px 12px;display:grid;gap:6px;align-content:start}
#log p{margin:0;line-height:1.3}
.me{color:var(--dim)}
.ai{color:var(--ice)}
.ai::before{content:"J ";color:var(--cy);font-weight:700}
.warn{color:var(--am)}
form,.row{display:flex;gap:8px}
input{flex:1;min-width:0;background:var(--panel);border:1px solid var(--line);border-radius:6px;color:var(--ice);font:inherit;padding:10px 12px}
button{background:transparent;border:1px solid var(--cy);border-radius:6px;color:var(--cy);font:inherit;font-weight:700;padding:10px 14px;cursor:pointer}
button[aria-pressed=true]{background:var(--cy);color:var(--bg)}
:focus-visible{outline:2px solid var(--am);outline-offset:2px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chips button{font-weight:500;padding:6px 10px;border-color:var(--line);color:var(--dim)}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>
<main>
<header><h1>J.A.R.V.I.S</h1><div id="clock">--:--:--</div></header>
<div id="core" aria-hidden="true">
<svg viewBox="0 0 300 300">
<defs><radialGradient id="g"><stop offset="0" stop-color="#d6f6ff"/><stop offset=".5" stop-color="#5ee7ff"/><stop offset="1" stop-color="#5ee7ff" stop-opacity="0"/></radialGradient></defs>
<g fill="none" stroke="#5ee7ff">
<circle class="r1" cx="150" cy="150" r="145" stroke-width="2" stroke-dasharray="3 9"/>
<circle class="r2" cx="150" cy="150" r="125" stroke-width="6" stroke-dasharray="70 22 20 22" stroke-opacity=".7"/>
<circle class="r3" cx="150" cy="150" r="100" stroke-width="1.5" stroke-dasharray="2 6"/>
<circle cx="150" cy="150" r="78" stroke-width="2" stroke="#1b4a5e"/>
</g>
<circle id="glow" cx="150" cy="150" r="62" fill="url(#g)"/>
<circle cx="150" cy="150" r="22" fill="#04101a" stroke="#d6f6ff" stroke-width="2"/>
</svg>
</div>
<div id="state">STANDING BY</div>
<section class="grid">
<div class="card"><b>Power</b><span id="t1">98%</span><div class="bar"><i id="b1" style="width:98%"></i></div></div>
<div class="card"><b>Core load</b><span id="t2">34%</span><div class="bar"><i id="b2" style="width:34%"></i></div></div>
<div class="card"><b>Network</b><span id="t3">212</span><div class="bar"><i id="b3" style="width:60%"></i></div></div>
</section>
<div id="log" role="log" aria-live="polite"></div>
<div class="chips" id="chips"></div>
<form id="f" autocomplete="off">
<input id="in" placeholder="Ask J.A.R.V.I.S…" aria-label="Command">
<button type="button" id="mic" aria-pressed="false">Mic</button>
<button type="submit">Send</button>
</form>
<div class="row"><button type="button" id="vox" aria-pressed="true">Voice on</button></div>
</main>
<script>
const $=id=>document.getElementById(id);
const log=$('log'), body=document.body;
let voiceOn=true;
function add(cls,text){const p=document.createElement('p');p.className=cls;p.textContent=text;log.appendChild(p);log.scrollTop=log.scrollHeight}
function speak(text){
  if(!voiceOn||!('speechSynthesis' in window))return;
  try{
    speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(text);u.rate=.95;u.pitch=.8;
    const v=speechSynthesis.getVoices().find(v=>/en-GB/.test(v.lang));
    if(v)u.voice=v;
    u.onstart=()=>{body.classList.add('talk');$('state').textContent='SPEAKING'};
    u.onend=u.onerror=()=>{body.classList.remove('talk');$('state').textContent='STANDING BY'};
    speechSynthesis.speak(u);
  }catch(e){}
}
function say(text){add('ai',text);speak(text)}
const pad=n=>String(n).padStart(2,'0');
function tick(){const d=new Date();$('clock').textContent=pad(d.getHours())+':'+pad(d.getMinutes())+':'+pad(d.getSeconds())}
setInterval(tick,1000);tick();
setInterval(()=>{
  const load=20+Math.round(Math.random()*40), net=150+Math.round(Math.random()*120);
  $('t2').textContent=load+'%';$('b2').style.width=load+'%';
  $('t3').textContent=net;$('b3').style.width=Math.min(100,net/3)+'%';
},2500);
const jokes=['I would tell you a joke about UDP, but you might not get it.','I tried to write a joke about latency. It arrived late.'];
const commands=[
 [/^(hi|hello|hey|good (morning|evening|afternoon))/,()=>{const h=new Date().getHours();return (h<12?'Good morning':h<18?'Good afternoon':'Good evening')+', sir. All systems are running.'}],
 [/time/,()=>'It is '+new Date().toLocaleTimeString([], {hour:'numeric',minute:'2-digit'})+'.'],
 [/date|day/,()=>'Today is '+new Date().toLocaleDateString([], {weekday:'long',month:'long',day:'numeric'})+'.'],
 [/status|diagnos|system/,()=>'Power at '+$('t1').textContent+', core load '+$('t2').textContent+', network nominal. No faults detected.'],
 [/joke/,()=>jokes[Math.floor(Math.random()*jokes.length)]],
 [/suit|armor|armour/,()=>'The suit is charged and idle. I would advise against flying it indoors.'],
 [/help|what can you/,()=>'Try: status, time, date, a joke, or ask about the suit.'],
];
function handle(q){
  q=q.trim();if(!q)return;
  add('me','> '+q);
  const s=q.toLowerCase();
  for(const [re,fn] of commands){if(re.test(s)){say(fn());return}}
  add('warn','No handler for that request yet.');
  speak('I do not have that capability yet, sir.');
}
$('f').addEventListener('submit',e=>{e.preventDefault();handle($('in').value);$('in').value=''});
['status','time','joke','help'].forEach(c=>{const b=document.createElement('button');b.type='button';b.textContent=c;b.onclick=()=>handle(c);$('chips').appendChild(b)});
$('vox').onclick=e=>{voiceOn=!voiceOn;e.target.setAttribute('aria-pressed',voiceOn);e.target.textContent=voiceOn?'Voice on':'Voice off';if(!voiceOn&&'speechSynthesis' in window)speechSynthesis.cancel()};
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
if(!SR){$('mic').disabled=true;add('warn','Voice input is not supported in this browser or app. Open the page in Chrome, Edge or Safari. You can still type.')}
else{
  const rec=new SR();rec.lang='en-US';rec.interimResults=false;
  rec.onstart=()=>{body.classList.add('listen');$('state').textContent='LISTENING';$('mic').setAttribute('aria-pressed','true')};
  rec.onend=()=>{body.classList.remove('listen');if(!body.classList.contains('talk'))$('state').textContent='STANDING BY';$('mic').setAttribute('aria-pressed','false')};
  rec.onresult=e=>handle(e.results[0][0].transcript);
  rec.onerror=e=>{const m={'not-allowed':'Microphone blocked. Allow mic access for this page, or open it in a full browser tab.','service-not-allowed':'Speech service blocked here. Open this page in Chrome or Safari directly.','no-speech':'I did not hear anything. Tap Mic and try again.','audio-capture':'No microphone found.','network':'Speech recognition needs an internet connection.'};add('warn',m[e.error]||('Voice input error: '+e.error))};
  $('mic').onclick=()=>{try{if('speechSynthesis' in window)speechSynthesis.cancel();rec.start()}catch(e){add('warn','Could not start the microphone: '+e.message)}};
}
add('ai','Online. Tap anywhere once to enable voice.');
add('me','Speech output: '+(('speechSynthesis' in window)?'available':'not available')+' | Speech input: '+(SR?'available':'not available'));
let unlocked=false;
document.addEventListener('pointerdown',()=>{if(unlocked)return;unlocked=true;speak('Voice systems active. Good to see you.')},{once:true});
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
</html>
